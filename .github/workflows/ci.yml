name: CI Pipeline - Asistente Adulto Mayor

on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  pipeline:

    runs-on: ubuntu-latest

    steps:

    # Descargar código del repositorio

    - name: Descargar repositorio
      uses: actions/checkout@v4

    # Instalar Python

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # Instalar librerías

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Ejecutar pruebas

    - name: Ejecutar pruebas unitarias
      run:
        pytest
    
    # Agregar BUILD + ARTIFACT
    - name: Crear paquete de entrega
      run: |
        zip -r asistente-adulto-mayor.zip . -x ".git/*"

    - name: Guardar artefacto
      uses: actions/upload-artifact@v4
      with:
        name: asistente-adulto-mayor
        path: asistente-adulto-mayor.zip
